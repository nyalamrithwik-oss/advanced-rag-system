# ============================================================================
# Nginx Configuration for Advanced RAG API
# ============================================================================
# Production-ready nginx configuration with:
# - SSL/TLS support
# - Rate limiting
# - Reverse proxy to uvicorn
# - Security headers
# - Compression
#
# Usage:
#   sudo cp config/nginx.conf /etc/nginx/sites-available/rag-api
#   sudo ln -s /etc/nginx/sites-available/rag-api /etc/nginx/sites-enabled/
#   sudo systemctl restart nginx
# ============================================================================

# Upstream connection to uvicorn app
upstream rag_api {
    # If running multiple workers, add them here:
    server localhost:8000 max_fails=3 fail_timeout=30s;
    # server localhost:8001;
    # server localhost:8002;
    keepalive 32;
}

# ============================================================================
# Rate Limiting Configuration
# ============================================================================
# Limit API key requests
limit_req_zone $http_x_api_key zone=api_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=60r/m;

# ============================================================================
# HTTP Configuration (Redirect to HTTPS)
# ============================================================================
server {
    listen 80;
    server_name api.example.com;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# ============================================================================
# HTTPS Configuration (Production)
# ============================================================================
server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ========================================================================
    # SSL/TLS Configuration
    # ========================================================================
    # Certificate paths (obtain from Let's Encrypt, AWS ACM, etc.)
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========================================================================
    # Security Headers
    # ========================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ========================================================================
    # Logging
    # ========================================================================
    access_log /var/log/nginx/rag-api-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/rag-api-error.log warn;

    # ========================================================================
    # Gzip Compression
    # ========================================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;
    gzip_vary on;

    # ========================================================================
    # Main API Configuration
    # ========================================================================
    location / {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_req zone=ip_limit burst=100 nodelay;

        # Proxy settings
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ========================================================================
    # Health Check Endpoint (no rate limiting)
    # ========================================================================
    location = /health {
        access_log off;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========================================================================
    # Static Files / Documentation
    # ========================================================================
    location ~ ^/(docs|openapi.json|redoc)/ {
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========================================================================
    # File Upload Configuration
    # ========================================================================
    location = /upload {
        # Larger timeout for file uploads
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        
        # Larger client body size for file uploads
        client_max_body_size 50M;

        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================================
    # Query Endpoint (with rate limiting)
    # ========================================================================
    location = /query {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req zone=ip_limit burst=100 nodelay;

        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for long queries
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # ========================================================================
    # Deny access to sensitive files
    # ========================================================================
    location ~ /\. {
        deny all;
        access_log off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
    }
}

